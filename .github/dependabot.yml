version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "bacon-ls*"
    groups:
      lsp:
        applies-to: version-updates
        patterns:
         - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      vscode:
        applies-to: version-updates
        patterns:
         - "*"
    ignore:
      # this needs to match engines.vscode and defines the minimum version of vscode
      - dependency-name: '@types/vscode'
      # @typescript-eslint/* declare a peer dependency of typescript <6.1.0, so a
      # major bump breaks `npm ci`. Bump by hand once typescript-eslint supports it:
      # https://github.com/typescript-eslint/typescript-eslint/issues?q=typescript+7
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
