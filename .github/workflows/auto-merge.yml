name: Dependabot Auto-merge

# Merge Dependabot pull requests only once the `ci` workflow has passed on
# them. `gh pr merge --auto` on the `opened` event would merge immediately
# because `main` has no required status checks, landing PRs before CI ran.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge the Dependabot PR that CI just validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .user.login == "dependabot[bot]")][0].number')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR found for $HEAD_SHA, nothing to merge."
            exit 0
          fi
          # --match-head-commit refuses to merge if Dependabot pushed a newer
          # commit since this CI run; the run for that commit will merge it.
          gh pr merge --repo "$REPO" --squash --body "" --match-head-commit "$HEAD_SHA" "$pr"
